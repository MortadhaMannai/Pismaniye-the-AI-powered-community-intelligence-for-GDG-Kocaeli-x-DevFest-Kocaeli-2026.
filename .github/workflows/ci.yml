name: PISMANIYE CI/CD — Quality, Multi-Agent Workflows, CLI & Docker

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-typecheck:
    name: Pytest, Mypy & 12-Command CLI Verification (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Static Type Check (Mypy)
        run: mypy pismaniye

      - name: Unit & Integration Test Suite (Pytest)
        run: pytest -v --tb=short

      - name: End-to-End CLI Command & Signature Workflow Smoke Suite
        run: |
          pismaniye launch --event devfest-kocaeli-2026
          pismaniye ask "Who should I meet?"
          pismaniye agents
          pismaniye event schedule
          pismaniye people discover --interest "Agentic AI"
          pismaniye people match --interest "Gemini" --grant-consent
          pismaniye kocaeli explore --hours 3
          pismaniye knowledge search "LangGraph"
          pismaniye trace latest
          pismaniye explain latest
          pismaniye doctor
          pismaniye demo

  docker-build-verify:
    name: Container Image Build & Health Check
    runs-on: ubuntu-latest
    needs: test-and-typecheck
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: docker build -t pismaniye:ci-test .

      - name: Verify Container Startup & Health Endpoint
        run: |
          docker run -d --name pismaniye-test -p 8080:8080 pismaniye:ci-test
          sleep 4
          curl -fsS http://127.0.0.1:8080/api/health | grep '"status":"healthy"'
          curl -fsS http://127.0.0.1:8080/api/qr.svg | grep '<svg'
          docker stop pismaniye-test
